<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administrasi Laboratorium</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
/* =============================
   CETAK LABEL TOM & JERRY NO.103
   Label: 64 x 32 mm
   Layout: 3 kolom x 4 baris = 12 label/lembar
   Lembar fisik: 210 x 150 mm
   ============================= */
@page{size:215.9mm 330.2mm;margin:0}
@page barcodePage{size:210mm 150mm;margin:0}

@media print{
  html,body{margin:0!important;padding:0!important;background:#fff!important;overflow:visible!important}
  body > *:not(#printHost){display:none!important}
  #printHost{display:block!important;position:static!important;margin:0!important;padding:0!important}

  /* Dokumen administrasi tetap F4/Folio */
  .print-area,.print-area *{visibility:visible!important}
  .print-area{page:auto;position:absolute;left:0;top:0;width:100%;margin:0!important;box-shadow:none!important}

  /* Barcode memakai halaman khusus 210 x 150 mm */
  .barcode-sheet,.barcode-sheet *{visibility:visible!important}
  .barcode-sheet{
    page:barcodePage;
    display:grid!important;
    position:relative!important;
    left:0!important;
    top:0!important;
    width:210mm!important;
    height:150mm!important;
    margin:0!important;
    padding:0!important;
    box-sizing:border-box!important;
    background:#fff!important;
    box-shadow:none!important;
    overflow:hidden!important;
  }
  .barcode-page-break{break-after:page!important;page-break-after:always!important}
}

.barcode-label{
  box-sizing:border-box;
  width:64mm;
  height:32mm;
  border:0;
  padding:2.2mm 2.5mm;
  text-align:center;
  background:white;
  overflow:hidden;
}
.barcode-label svg{display:block;width:100%;height:12mm;margin:1mm auto 0}

/* Posisi 3 x 4 dibuat simetris di lembar 210 x 150 mm.
   Jarak antar label 2 mm; sisa margin sekitar 7 mm kiri/kanan
   dan 8 mm atas/bawah. */
.barcode-sheet{
  width:210mm;
  height:150mm;
  box-sizing:border-box;
  padding:8mm 7mm;
  display:grid;
  grid-template-columns:repeat(3,64mm);
  grid-template-rows:repeat(4,32mm);
  column-gap:2mm;
  row-gap:2mm;
  background:white;
  align-content:start;
}

.scan-result{min-height:92px}
#reader{width:100%;max-width:520px;margin:auto}
#reader video{border-radius:16px}
</style>
</head>
<body class="bg-slate-100 text-slate-800">
<div id="login" class="min-h-screen flex items-center justify-center p-4">
 <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8">
  <div class="text-center mb-7"><div class="w-16 h-16 rounded-2xl bg-indigo-600 text-white mx-auto flex items-center justify-center text-2xl"><i class="fa-solid fa-flask"></i></div><h1 class="text-2xl font-bold mt-4">Administrasi Laboratorium</h1><p class="text-slate-500 text-sm">Silakan masuk menggunakan akun Firebase.</p></div>
  <form id="loginForm" class="space-y-4"><input id="email" type="email" required placeholder="Email" class="w-full border rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-indigo-500"><input id="password" type="password" required placeholder="Password" class="w-full border rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-indigo-500"><button class="w-full bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl py-3 font-semibold">Masuk</button><p id="loginError" class="text-red-600 text-sm"></p></form>
 </div>
</div>
<div id="app" class="hidden min-h-screen">
 <aside class="fixed inset-y-0 left-0 w-64 bg-slate-900 text-white p-5 hidden md:block"><div class="flex items-center gap-3 mb-8"><div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center"><i class="fa-solid fa-flask"></i></div><div><div class="font-bold">Lab Admin</div><div id="sideSchool" class="text-xs text-slate-400">Nama Sekolah</div></div></div>
  <nav class="space-y-2"><button data-page="dashboard" class="nav w-full text-left px-4 py-3 rounded-xl bg-indigo-600"><i class="fa-solid fa-chart-line w-5"></i> Dashboard</button><button data-page="inventaris" class="nav w-full text-left px-4 py-3 rounded-xl hover:bg-slate-800"><i class="fa-solid fa-boxes-stacked w-5"></i> Inventaris</button><button data-page="kondisi" class="nav w-full text-left px-4 py-3 rounded-xl hover:bg-slate-800"><i class="fa-solid fa-screwdriver-wrench w-5"></i> Kondisi Barang</button><button data-page="barcode" class="nav w-full text-left px-4 py-3 rounded-xl hover:bg-slate-800"><i class="fa-solid fa-barcode w-5"></i> Cetak Barcode</button><button data-page="scanner" class="nav w-full text-left px-4 py-3 rounded-xl hover:bg-slate-800"><i class="fa-solid fa-camera w-5"></i> Scan Barcode</button><button data-page="administrasi" class="nav w-full text-left px-4 py-3 rounded-xl hover:bg-slate-800"><i class="fa-solid fa-file-lines w-5"></i> Administrasi & Cetak</button><button data-page="pengaturan" class="nav w-full text-left px-4 py-3 rounded-xl hover:bg-slate-800"><i class="fa-solid fa-gear w-5"></i> Pengaturan</button></nav>
  <button id="logout" class="absolute bottom-5 left-5 right-5 border border-slate-700 hover:bg-slate-800 rounded-xl py-3"><i class="fa-solid fa-right-from-bracket mr-2"></i> Keluar</button>
 </aside>
 <main class="md:ml-64 p-4 md:p-8"><div class="flex justify-between items-center mb-6"><div><h1 id="pageTitle" class="text-2xl md:text-3xl font-bold">Dashboard</h1><p id="pageDesc" class="text-slate-500">Ringkasan inventaris laboratorium.</p></div><div class="flex items-center gap-2"><span id="realtimeStatus" class="text-xs font-semibold px-3 py-2 rounded-full bg-slate-100 text-slate-500">Menghubungkan...</span><button id="mobileMenu" class="md:hidden bg-slate-900 text-white px-4 py-3 rounded-xl"><i class="fa-solid fa-bars"></i></button></div></div><div id="content"></div></main>
</div>
<div id="modal" class="hidden fixed inset-0 bg-black/50 z-50 p-4 items-center justify-center"><div class="bg-white rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-auto"><div class="p-5 border-b flex justify-between"><h2 id="modalTitle" class="font-bold text-xl"></h2><button onclick="closeModal()" class="text-slate-500 text-xl">&times;</button></div><div id="modalBody" class="p-5"></div></div></div>

<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
import {getDatabase,ref,onValue,set,remove,get,runTransaction} from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js';
const firebaseConfig={apiKey:'AIzaSyDVibI177apEj0K4mFPe7K3mz6SJYnJzoI',authDomain:'labcomgama.firebaseapp.com',projectId:'labcomgama',storageBucket:'labcomgama.firebasestorage.app',messagingSenderId:'368615542114',appId:'1:368615542114:web:7677193524cb582731f03b',measurementId:'G-2T25FNMZ65',databaseURL:'https://labcomgama-default-rtdb.asia-southeast1.firebasedatabase.app'};
const RTDB_ROOT='labcomgama';
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app);
let items={},settings={schoolName:'Nama Sekolah',foundation:'',address:'',signatureCity:'',principal:'',principalNiy:'',manager:'',managerNiy:'',logo:''};
let categories={Komputer:{prefix:'KOMP'},'Perangkat Pendukung':{prefix:'PER'},Furniture:{prefix:'FUR'},Lainnya:{prefix:'LAIN'}};
let locations={};
let currentPage='dashboard';
const $=id=>document.getElementById(id);
function esc(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function statusBadge(s){const cls=s==='Baik'?'bg-emerald-100 text-emerald-700':s==='Rusak'?'bg-red-100 text-red-700':'bg-amber-100 text-amber-700';return `<span class="px-2 py-1 rounded-full text-xs font-semibold ${cls}">${esc(s||'Baik')}</span>`}
function allItems(){return Object.values(items).sort((a,b)=>String(a.kode||'').localeCompare(String(b.kode||''),undefined,{numeric:true}))}
function listen(path,cb){onValue(ref(db,`${RTDB_ROOT}/${path}`),snap=>cb(snap.val()||{}),e=>console.error(e))}
function loadData(){
 let modern={},legacyKomputer={},legacyPerangkat={};
 const rebuild=()=>{items={...Object.fromEntries(Object.entries(legacyKomputer).map(([k,x])=>[k,{...x,kategori:x.kategori||'Komputer'}])),...Object.fromEntries(Object.entries(legacyPerangkat).map(([k,x])=>[k,{...x,kategori:x.kategori||'Perangkat Pendukung'}])),...modern};render();};
 listen('inventaris',v=>{modern=v||{};rebuild();});
 // Kompatibel dengan data lama: data komputer/perangkat tetap terbaca tanpa menghapus data lama.
 listen('komputer',v=>{legacyKomputer=v||{};rebuild();});
 listen('perangkat',v=>{legacyPerangkat=v||{};rebuild();});
 listen('kategori',v=>{categories={...categories,...(v||{})};render();});
  listen('lokasi',v=>{locations=v||{};render();});
  listen('pengaturan',v=>{settings={...settings,...v,logo:loadLocalLogo()};
  if(!settings.principalNiy && v?.principalNip) settings.principalNiy=v.principalNip;
  if(!settings.managerNiy && v?.managerNip) settings.managerNiy=v.managerNip;
  $('sideSchool').textContent=settings.schoolName||'Nama Sekolah';render();});
}

onValue(ref(db,'.info/connected'),snap=>{const el=$('realtimeStatus');if(!el)return;if(snap.val()===true){el.textContent='● Realtime aktif';el.className='text-xs font-semibold px-3 py-2 rounded-full bg-emerald-50 text-emerald-700';}else{el.textContent='● Offline / menghubungkan';el.className='text-xs font-semibold px-3 py-2 rounded-full bg-amber-50 text-amber-700';}});

function pageMeta(){return {dashboard:['Dashboard','Ringkasan inventaris laboratorium.'],inventaris:['Inventaris','Kelola barang tanpa spesifikasi komputer yang rumit.'],kondisi:['Kondisi Barang','Lihat barang baik, rusak, dan perlu perbaikan.'],barcode:['Cetak Barcode','Buat label barcode untuk ditempel pada komputer dan inventaris.'],scanner:['Scan Barcode','Scan dengan kamera HP atau scanner USB di komputer.'],administrasi:['Administrasi & Cetak','Buat dokumen untuk kepala sekolah dari data inventaris.'],pengaturan:['Pengaturan','Identitas sekolah, kategori inventaris, dan daftar lokasi/ruangan.']}[currentPage]}
function render(){if(!$('app').classList.contains('hidden')){const [t,d]=pageMeta();$('pageTitle').textContent=t;$('pageDesc').textContent=d;document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('bg-indigo-600',b.dataset.page===currentPage));document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('bg-slate-800',b.dataset.page!==currentPage));const f={dashboard:dashboard,inventaris:inventaris,kondisi:kondisi,barcode:barcode,scanner:scanner,administrasi:administrasi,pengaturan:pengaturan}[currentPage];$('content').innerHTML=f();if(currentPage==='inventaris')setTimeout(renderInvRows,0);if(currentPage==='barcode')setTimeout(renderBarcodeList,0);}}
function dashboard(){const a=allItems(),baik=a.filter(x=>(x.kondisi||'Baik')==='Baik').length,rusak=a.filter(x=>x.kondisi==='Rusak').length,perbaikan=a.filter(x=>x.kondisi==='Perlu Perbaikan').length;return `<div class="grid md:grid-cols-4 gap-4 mb-6"><div class="bg-white rounded-2xl p-5 shadow-sm"><p class="text-slate-500 text-sm">Total Inventaris</p><b class="text-3xl">${a.length}</b></div><div class="bg-white rounded-2xl p-5 shadow-sm"><p class="text-slate-500 text-sm">Baik</p><b class="text-3xl text-emerald-600">${baik}</b></div><div class="bg-white rounded-2xl p-5 shadow-sm"><p class="text-slate-500 text-sm">Perlu Perbaikan</p><b class="text-3xl text-amber-600">${perbaikan}</b></div><div class="bg-white rounded-2xl p-5 shadow-sm"><p class="text-slate-500 text-sm">Rusak</p><b class="text-3xl text-red-600">${rusak}</b></div></div><div class="bg-white rounded-2xl p-6 shadow-sm"><div class="flex flex-wrap gap-3"><button onclick="showPage('inventaris');openItem()" class="bg-indigo-600 text-white px-4 py-3 rounded-xl"><i class="fa-solid fa-plus mr-2"></i>Tambah Inventaris</button><button onclick="showPage('barcode')" class="border px-4 py-3 rounded-xl">Cetak Barcode</button><button onclick="showPage('administrasi')" class="border px-4 py-3 rounded-xl">Buat Administrasi</button></div><div class="mt-6 p-4 bg-slate-50 rounded-xl text-sm text-slate-600">${a.length?`Data terhubung ke Firebase Realtime Database. Perubahan akan tampil otomatis.`:'Belum ada inventaris. Tambahkan komputer, printer, proyektor, meja, atau barang lab lainnya.'}</div></div>`}
function inventaris(){const a=allItems();return `<div class="bg-white rounded-2xl shadow-sm overflow-hidden"><div class="p-5 flex flex-col md:flex-row gap-3 md:items-center md:justify-between"><input id="searchInv" oninput="renderInvRows()" placeholder="Cari kode, kategori, lokasi..." class="border rounded-xl px-4 py-3 w-full md:w-96"><button onclick="openItem()" class="bg-indigo-600 text-white px-4 py-3 rounded-xl whitespace-nowrap"><i class="fa-solid fa-plus mr-2"></i>Tambah Barang</button></div><div class="overflow-auto"><table class="w-full text-sm"><thead class="bg-slate-50"><tr><th class="p-3 text-left">Kode</th><th class="p-3 text-left">Kategori</th><th class="p-3 text-left">Jumlah</th><th class="p-3 text-left">Lokasi</th><th class="p-3 text-left">Kondisi</th><th class="p-3">Aksi</th></tr></thead><tbody id="invRows"></tbody></table></div></div>`}
window.renderInvRows=()=>{const q=($('searchInv')?.value||'').toLowerCase();const rows=allItems().filter(x=>`${x.kode} ${x.nama||''} ${x.kategori||''} ${x.lokasi||''}`.toLowerCase().includes(q));$('invRows').innerHTML=rows.length?rows.map(x=>`<tr class="border-t"><td class="p-3 font-semibold">${esc(x.kode)}</td><td class="p-3">${esc(x.kategori||'Lainnya')}</td><td class="p-3">${esc(x.jumlah||1)}</td><td class="p-3">${esc(x.lokasi)}</td><td class="p-3">${statusBadge(x.kondisi)}</td><td class="p-3"><div class="flex justify-center gap-2"><button onclick="openItem('${esc(x.id)}')" class="px-3 py-2 border rounded-lg">Edit</button><button onclick="printLabel('${esc(x.id)}')" class="px-3 py-2 border rounded-lg">Barcode</button><button onclick="deleteItem('${esc(x.id)}')" class="px-3 py-2 border rounded-lg text-red-600">Hapus</button></div></td></tr>`).join(''):`<tr><td colspan="6" class="p-8 text-center text-slate-500">Belum ada data.</td></tr>`}
function kondisi(){const a=allItems();return `<div class="grid md:grid-cols-3 gap-4 mb-5"><div class="bg-emerald-50 rounded-2xl p-5"><div class="text-sm">Baik</div><b class="text-3xl">${a.filter(x=>(x.kondisi||'Baik')==='Baik').length}</b></div><div class="bg-amber-50 rounded-2xl p-5"><div class="text-sm">Perlu Perbaikan</div><b class="text-3xl">${a.filter(x=>x.kondisi==='Perlu Perbaikan').length}</b></div><div class="bg-red-50 rounded-2xl p-5"><div class="text-sm">Rusak</div><b class="text-3xl">${a.filter(x=>x.kondisi==='Rusak').length}</b></div></div><div class="bg-white rounded-2xl shadow-sm overflow-auto"><table class="w-full text-sm"><thead class="bg-slate-50"><tr><th class="p-3 text-left">Kode</th><th class="p-3 text-left">Barang</th><th class="p-3 text-left">Lokasi</th><th class="p-3 text-left">Kondisi</th><th class="p-3 text-left">Keterangan</th><th class="p-3">Aksi</th></tr></thead><tbody>${a.map(x=>`<tr class="border-t"><td class="p-3 font-semibold">${esc(x.kode)}</td><td class="p-3">${esc(x.nama||x.kategori||'Inventaris')}</td><td class="p-3">${esc(x.lokasi)}</td><td class="p-3">${statusBadge(x.kondisi)}</td><td class="p-3">${esc(x.keterangan||'-')}</td><td class="p-3 text-center"><button onclick="openItem('${esc(x.id)}')" class="border px-3 py-2 rounded-lg">Ubah</button></td></tr>`).join('')||'<tr><td colspan="6" class="p-8 text-center">Belum ada data.</td></tr>'}</tbody></table></div>`}
function barcode(){
 return `<div class="space-y-5">
  <div class="bg-white rounded-2xl p-6 shadow-sm">
   <div class="flex flex-wrap items-start justify-between gap-4">
    <div><h2 class="font-bold text-lg">Cetak Barcode Inventaris</h2>
    <p class="text-sm text-slate-500 mt-1">Format label Tom & Jerry No. 103: 64 × 32 mm, 3 kolom × 4 baris = 12 label per lembar. Ukuran lembar cetak disiapkan otomatis 210 × 150 mm.</p></div>
   </div>
   <div class="grid md:grid-cols-4 gap-3 mt-5">
    <label class="text-sm font-semibold">Filter kategori
     <select id="barcodeFilter" onchange="renderBarcodeList()" class="mt-1 w-full border rounded-xl px-4 py-3">
      <option value="all">Semua kategori</option>
      ${Object.keys(categories).map(k=>`<option value="${esc(k)}">${esc(k)}</option>`).join('')}
     </select>
    </label>
    <label class="text-sm font-semibold">Mulai nomor
     <input id="barcodeStart" type="number" min="1" value="1" class="mt-1 w-full border rounded-xl px-4 py-3" placeholder="Contoh: 13">
    </label>
    <label class="text-sm font-semibold">Sampai nomor
     <input id="barcodeEnd" type="number" min="1" value="12" class="mt-1 w-full border rounded-xl px-4 py-3" placeholder="Contoh: 24">
    </label>
    <div class="flex items-end gap-2">
     <button onclick="printSelectedLabelRange()" class="flex-1 bg-indigo-600 text-white rounded-xl px-4 py-3"><i class="fa-solid fa-print mr-2"></i>Cetak Rentang</button>
     <button onclick="printAllLabels()" class="border rounded-xl px-4 py-3" title="Cetak semua barcode"><i class="fa-solid fa-print"></i></button>
    </div>
   </div>
   <div class="mt-4 p-4 bg-indigo-50 rounded-xl text-sm text-slate-700">
    <b>Contoh:</b> jika ingin mencetak barcode nomor <b>13 sampai 24</b>, isi <b>Mulai 13</b> dan <b>Sampai 24</b>, lalu klik <b>Cetak Rentang</b>. Jika hasilnya lebih dari 12 label, otomatis dibuat menjadi beberapa lembar.
   </div>
   <div class="mt-3 p-4 bg-slate-50 rounded-xl text-sm text-slate-600"><b>Tips cetak:</b> gunakan kertas/template <b>210 × 150 mm</b>. Aplikasi sudah menyiapkan ukuran label 64 × 32 mm dan posisi 3 × 4. Jika dialog printer menampilkan skala, pilih <b>100%</b> / Actual Size dan matikan “Fit to page”.</div>
  </div>
  <div id="barcodeList" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
 </div>`
}
window.renderBarcodeList=()=>{
 const f=$('barcodeFilter')?.value||'all';
 const a=allItems().filter(x=>f==='all'||(x.kondisi||'Baik')===f);
 $('barcodeList').innerHTML=a.length?a.map(x=>`
  <div class="border rounded-2xl p-4 bg-white">
   <div class="text-center text-sm font-semibold">${esc(x.nama||x.kategori||'Inventaris')}</div>
   <div class="text-center text-xs text-slate-500 mb-2">${esc(x.kode)} • ${esc(x.kondisi||'Baik')}</div>
   <svg id="bc-${esc(x.id)}"></svg>
   <div class="text-center text-xs">${esc(settings.schoolName)}</div>
   <div class="flex justify-center gap-2 mt-3">
    <button onclick="printLabel('${esc(x.id)}')" class="border px-3 py-2 rounded-lg"><i class="fa-solid fa-print mr-1"></i>Cetak</button>
    <button onclick="showPage('scanner');setTimeout(()=>lookupBarcode('${esc(x.kode)}'),100)" class="border px-3 py-2 rounded-lg"><i class="fa-solid fa-camera mr-1"></i>Scan</button>
   </div>
  </div>`).join(''):'<div class="text-slate-500">Belum ada inventaris.</div>';
 setTimeout(()=>a.forEach(x=>{
  try{JsBarcode('#bc-'+x.id,x.kode||x.id,{format:'CODE128',displayValue:true,height:55,margin:4,fontSize:12});}catch(e){}
 }),0)
}

let qrScanner=null;
let activeCamera='environment';

function scanner(){
 return `<div class="grid lg:grid-cols-2 gap-5">
  <div class="bg-white rounded-2xl p-5 shadow-sm">
   <div class="flex items-start justify-between gap-3 mb-4">
    <div><h2 class="font-bold text-lg">Scan Barcode</h2><p class="text-sm text-slate-500">Gunakan kamera HP atau scanner barcode USB/Bluetooth.</p></div>
    <span class="px-3 py-1 rounded-full bg-emerald-50 text-emerald-700 text-xs font-semibold">Siap</span>
   </div>

   <div class="flex flex-wrap gap-2 mb-4">
    <button id="startCameraBtn" onclick="startCamera()" class="bg-indigo-600 text-white px-4 py-3 rounded-xl"><i class="fa-solid fa-camera mr-2"></i>Mulai Kamera</button>
    <button onclick="switchCamera()" class="border px-4 py-3 rounded-xl"><i class="fa-solid fa-repeat mr-2"></i>Depan/Belakang</button>
    <button onclick="stopCamera()" class="border px-4 py-3 rounded-xl"><i class="fa-solid fa-stop mr-2"></i>Stop</button>
   </div>

   <div id="reader" class="bg-slate-50 rounded-2xl p-2"></div>

   <div class="mt-5 border-t pt-5">
    <label class="font-semibold text-sm">Scanner USB / Bluetooth di komputer</label>
    <p class="text-xs text-slate-500 mb-2">Klik kolom ini, lalu scan barcode. Scanner biasanya mengirim kode seperti mengetik dari keyboard.</p>
    <div class="flex gap-2">
     <input id="hardwareBarcode" autocomplete="off" class="flex-1 border-2 border-indigo-200 rounded-xl px-4 py-3 text-lg font-semibold" placeholder="Klik di sini lalu scan barcode..." onkeydown="hardwareScan(event)">
     <button onclick="lookupBarcode($('hardwareBarcode').value)" class="bg-slate-900 text-white px-4 py-3 rounded-xl"><i class="fa-solid fa-magnifying-glass"></i></button>
    </div>
   </div>
  </div>

function inventoryPrefix(category){
 return (categories[category]?.prefix||category||'ITEM').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,12)||'ITEM';
}
function maxInventorySequence(data,prefix){
 let max=0;
 Object.values(data||{}).forEach(x=>{
   const code=String(x?.kode||'').toUpperCase().trim();
   const m=code.match(new RegExp('^'+prefix+'-(\\d+)$'));
   if(m)max=Math.max(max,Number(m[1]));
 });
 return max;
}
function nextInventoryCode(category){
 const prefix=inventoryPrefix(category);
 return `${prefix}-${String(maxInventorySequence(items,prefix)+1).padStart(2,'0')}`;
}
async function reserveNextInventoryCode(category){
 const prefix=inventoryPrefix(category);
 const paths=['inventaris','komputer','perangkat'];
 const snapshots=await Promise.all(paths.map(path=>get(ref(db,`${RTDB_ROOT}/${path}`))));
 const maxExisting=snapshots.reduce((max,snap)=>Math.max(max,maxInventorySequence(snap.val()||{},prefix)),0);
 const counterRef=ref(db,`${RTDB_ROOT}/kodeCounters/${prefix}`);
 const result=await runTransaction(counterRef,current=>Math.max(Number(current)||0,maxExisting)+1);
 if(!result.committed)throw new Error('Nomor kode inventaris tidak berhasil dicadangkan.');
 return `${prefix}-${String(result.snapshot.val()).padStart(2,'0')}`;
}

  <div style="font-size:6px;line-height:1.05">${esc(x.nama||x.kategori||'Inventaris')}</div>
  <div style="font-size:5.5px;line-height:1.05">${esc(x.lokasi||'')}</div>
  <svg id="allBc${pageIndex}_${i}"></svg><div style="font-size:7px;font-weight:700;line-height:1">${esc(x.kode||x.id)}</div>
 </div>`).join('')}</div>`).join('');
 host.classList.remove('hidden');
 chunks.forEach((chunk,pageIndex)=>chunk.forEach((x,i)=>JsBarcode('#allBc'+pageIndex+'_'+i,x.kode||x.id,{format:'CODE128',displayValue:false,height:42,width:1.35,margin:0})));
 setTimeout(()=>{window.print();host.classList.add('hidden')},350)
}

function letterHead(){return `<div style="display:grid;grid-template-columns:90px 1fr 90px;align-items:center;border-bottom:2px solid #111;padding-bottom:10px;margin-bottom:25px">${settings.logo?`<div style="display:flex;align-items:center;justify-content:flex-start;height:75px"><img src="${esc(settings.logo)}" style="height:70px;width:80px;object-fit:contain"></div>`:`<div></div>`}<div style="text-align:center"><div style="font-size:15px;font-weight:bold">${esc(settings.foundation)}</div><div style="font-size:20px;font-weight:bold">${esc(settings.schoolName)}</div><div style="font-size:12px;white-space:pre-line">${esc(settings.address)}</div></div><div></div></div>`}
function formatTanggalIndonesia(date=new Date()){
 const bulan=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
 return `${date.getDate()} ${bulan[date.getMonth()]} ${date.getFullYear()}`;
}
window.printDocument=()=>{const type=$('docType').value,id=$('docItem').value,note=$('docNote').value;const x=items[id];const titles={kerusakan:'LAPORAN KERUSAKAN BARANG',perbaikan:'PERMOHONAN PERBAIKAN BARANG',pengadaan:'PERMOHONAN PENGADAAN BARANG',pemberitahuan:'PEMBERITAHUAN KEPADA KEPALA SEKOLAH',kondisi:'LAPORAN KONDISI LABORATORIUM',tugas:'SURAT TUGAS PENGELOLA LABORATORIUM'};let body='';if(type==='tugas'){body=`<p>Dengan ini menugaskan:</p><table style="margin:15px auto"><tr><td style="padding:4px 20px 4px 0">Nama</td><td>: ${esc(settings.manager||'................................')}</td></tr><tr><td style="padding:4px 20px 4px 0">NIY</td><td>: ${esc(settings.managerNiy||'................................')}</td></tr><tr><td style="padding:4px 20px 4px 0">Tugas</td><td>: Pengelolaan Laboratorium Komputer</td></tr></table><p>Demikian surat tugas ini dibuat untuk dilaksanakan sebagaimana mestinya.</p>`}else if(type==='kondisi'){const a=allItems();body=`<p>Berikut rekap kondisi inventaris laboratorium:</p><table style="width:100%;border-collapse:collapse;margin-top:15px"><tr><th style="border:1px solid #111;padding:7px">No</th><th style="border:1px solid #111;padding:7px">Kode</th><th style="border:1px solid #111;padding:7px">Barang</th><th style="border:1px solid #111;padding:7px">Lokasi</th><th style="border:1px solid #111;padding:7px">Kondisi</th></tr>${a.map((z,i)=>`<tr><td style="border:1px solid #111;padding:7px;text-align:center">${i+1}</td><td style="border:1px solid #111;padding:7px">${esc(z.kode)}</td><td style="border:1px solid #111;padding:7px">${esc(z.nama)}</td><td style="border:1px solid #111;padding:7px">${esc(z.lokasi)}</td><td style="border:1px solid #111;padding:7px">${esc(z.kondisi||'Baik')}</td></tr>`).join('')}</table>`}else{if(!x){alert('Pilih barang terlebih dahulu.');return}body=`<p>Dengan hormat, bersama ini kami menyampaikan bahwa terdapat data inventaris sebagai berikut:</p><table style="margin:15px 0"><tr><td style="padding:5px 20px 5px 0">Kode</td><td>: ${esc(x.kode)}</td></tr><tr><td style="padding:5px 20px 5px 0">Nama Barang</td><td>: ${esc(x.nama||x.kategori||'Inventaris')}</td></tr><tr><td style="padding:5px 20px 5px 0">Lokasi</td><td>: ${esc(x.lokasi)}</td></tr><tr><td style="padding:5px 20px 5px 0">Kondisi</td><td>: ${esc(x.kondisi||'Baik')}</td></tr></table><p>${esc(note||x.keterangan||'Mohon dapat ditindaklanjuti sesuai kebutuhan.')}</p>`}const html=`<div class="print-area" style="font-family:Arial,sans-serif;font-size:12pt;line-height:1.6;padding:20mm"><style>@page{size:215.9mm 330.2mm;margin:0}</style>${letterHead()}<h2 style="text-align:center;font-size:16px;margin:20px 0;text-decoration:underline">${titles[type]}</h2>${body}<div style="margin-top:45px;margin-left:65%;text-align:center">${esc(settings.signatureCity||settings.address||'')}, ${formatTanggalIndonesia()}<br>Kepala Sekolah<br><br><br><b><u>${esc(settings.principal||'................................')}</u></b><br>${settings.principalNiy?`NIY. ${esc(settings.principalNiy)}`:''}</div></div>`;$('printHost').innerHTML=html;$('printHost').classList.remove('hidden');setTimeout(()=>{window.print();$('printHost').classList.add('hidden')},100)}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginError').textContent='';try{await signInWithEmailAndPassword(auth,$('email').value,$('password').value)}catch(err){$('loginError').textContent='Email atau password salah / akun belum terdaftar.'}};
$('logout').onclick=()=>signOut(auth);document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>showPage(b.dataset.page));window.showPage=p=>{if(currentPage==='scanner'&&p!=='scanner')stopCamera();currentPage=p;render();if(p==='inventaris')setTimeout(renderInvRows,0);if(p==='barcode')setTimeout(renderBarcodeList,0)};
$('mobileMenu').onclick=()=>alert('Gunakan menu pada tampilan desktop. Versi mobile tetap dapat dibuka dan digunakan untuk melihat data.');
$('content').addEventListener('submit',async e=>{
 if(e.target.id==='settingsForm'){
  e.preventDefault();
  const form=e.target;
  const btn=$('saveSettingsBtn');
  const file=$('schoolLogoFile')?.files?.[0];
  const d=Object.fromEntries(new FormData(form));
  delete d.logo;
  try{
   if(btn){btn.disabled=true;btn.textContent='Menyimpan...';}
   if(file){
    if(file.size>2*1024*1024){alert('Ukuran logo maksimal 2 MB.');return;}
    if(!file.type.startsWith('image/')){alert('File logo harus berupa gambar.');return;}
    const dataUrl=await fileToDataUrl(file);
    if(!saveLocalLogo(dataUrl)){throw new Error('Penyimpanan logo di browser gagal.');}
    settings.logo=dataUrl;
   }
   d.address=String(d.address||'').replace(/\r\n/g,'\n').trim();
   await set(ref(db,`${RTDB_ROOT}/pengaturan`),d);
   render();
   alert(file?'Logo dan pengaturan sekolah berhasil disimpan di perangkat ini.':'Pengaturan sekolah berhasil disimpan.');
  }catch(err){
   console.error(err);
   alert('Gagal menyimpan pengaturan/logo di perangkat ini. Coba gunakan file logo yang lebih kecil (maksimal 2 MB).');
  }finally{
   if(btn){btn.disabled=false;btn.textContent='Simpan Pengaturan';}
  }
 }
});

window.removeSchoolLogo=async()=>{
 if(!settings.logo)return;
 if(!confirm('Hapus logo sekolah dari perangkat ini?'))return;
 removeLocalLogo();
 settings.logo='';
 render();
};
onAuthStateChanged(auth,user=>{if(user){$('login').classList.add('hidden');$('app').classList.remove('hidden');loadData();render()}else{$('login').classList.remove('hidden');$('app').classList.add('hidden')}});
</script>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administrasi Laboratorium</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
@media print{body *{visibility:hidden!important}.print-area,.print-area *{visibility:visible!important}.print-area{position:absolute;left:0;top:0;width:100%;margin:0!important;box-shadow:none!important}}
.barcode-label{width:65mm;min-height:35mm;border:1px solid #111;padding:4mm;text-align:center;background:white}.barcode-label svg{max-width:100%;height:18mm}
</style>
</head>
<body class="bg-slate-100 text-slate-800">
<div id="login" class="min-h-screen flex items-center justify-center p-4">
 <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8">
  <div class="text-center mb-7"><div class="w-16 h-16 rounded-2xl bg-indigo-600 text-white mx-auto flex items-center justify-center text-2xl"><i class="fa-solid fa-flask"></i></div><h1 class="text-2xl font-bold mt-4">Administrasi Laboratorium</h1><p class="text-slate-500 text-sm">Silakan masuk menggunakan akun Firebase.</p></div>
  <form id="loginForm" class="space-y-4"><input id="email" type="email" required placeholder="Email" class="w-full border rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-indigo-500"><input id="password" type="password" required placeholder="Password" class="w-full border rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-indigo-500"><button class="w-full bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl py-3 font-semibold">Masuk</button><p id="loginError" class="text-red-600 text-sm"></p></form>
 </div>
</div>
<div id="app" class="hidden min-h-screen">
 <aside class="fixed inset-y-0 left-0 w-64 bg-slate-900 text-white p-5 hidden md:block"><div class="flex items-center gap-3 mb-8"><div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center"><i class="fa-solid fa-flask"></i></div><div><div class="font-bold">Lab Admin</div><div id="sideSchool" class="text-xs text-slate-400">Nama Sekolah</div></div></div>
  <nav class="space-y-2"><button data-page="dashboard" class="nav w-full text-left px-4 py-3 rounded-xl bg-indigo-600"><i class="fa-solid fa-chart-line w-5"></i> Dashboard</button><button data-page="inventaris" class="nav w-full text-left px-4 py-3 rounded-xl hover:bg-slate-800"><i class="fa-solid fa-boxes-stacked w-5"></i> Inventaris</button><button data-page="kondisi" class="nav w-full text-left px-4 py-3 rounded-xl hover:bg-slate-800"><i class="fa-solid fa-screwdriver-wrench w-5"></i> Kondisi Barang</button><button data-page="barcode" class="nav w-full text-left px-4 py-3 rounded-xl hover:bg-slate-800"><i class="fa-solid fa-barcode w-5"></i> Cetak Barcode</button><button data-page="administrasi" class="nav w-full text-left px-4 py-3 rounded-xl hover:bg-slate-800"><i class="fa-solid fa-file-lines w-5"></i> Administrasi & Cetak</button><button data-page="pengaturan" class="nav w-full text-left px-4 py-3 rounded-xl hover:bg-slate-800"><i class="fa-solid fa-gear w-5"></i> Pengaturan</button></nav>
  <button id="logout" class="absolute bottom-5 left-5 right-5 border border-slate-700 hover:bg-slate-800 rounded-xl py-3"><i class="fa-solid fa-right-from-bracket mr-2"></i> Keluar</button>
 </aside>
 <main class="md:ml-64 p-4 md:p-8"><div class="flex justify-between items-center mb-6"><div><h1 id="pageTitle" class="text-2xl md:text-3xl font-bold">Dashboard</h1><p id="pageDesc" class="text-slate-500">Ringkasan inventaris laboratorium.</p></div><button id="mobileMenu" class="md:hidden bg-slate-900 text-white px-4 py-3 rounded-xl"><i class="fa-solid fa-bars"></i></button></div><div id="content"></div></main>
</div>
<div id="modal" class="hidden fixed inset-0 bg-black/50 z-50 p-4 items-center justify-center"><div class="bg-white rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-auto"><div class="p-5 border-b flex justify-between"><h2 id="modalTitle" class="font-bold text-xl"></h2><button onclick="closeModal()" class="text-slate-500 text-xl">&times;</button></div><div id="modalBody" class="p-5"></div></div></div>
<div id="printHost" class="hidden"></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
import {getDatabase,ref,onValue,set,remove,get} from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js';
const firebaseConfig={apiKey:'AIzaSyDVibI177apEj0K4mFPe7K3mz6SJYnJzoI',authDomain:'labcomgama.firebaseapp.com',projectId:'labcomgama',storageBucket:'labcomgama.firebasestorage.app',messagingSenderId:'368615542114',appId:'1:368615542114:web:7677193524cb582731f03b',measurementId:'G-2T25FNMZ65',databaseURL:'https://labcomgama-default-rtdb.asia-southeast1.firebasedatabase.app'};
const RTDB_ROOT='labcomgama';
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app);
let items={},settings={schoolName:'Nama Sekolah',foundation:'',address:'',signatureCity:'',principal:'',principalNiy:'',manager:'',managerNiy:'',logo:''};
let currentPage='dashboard';
const $=id=>document.getElementById(id);
function esc(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function statusBadge(s){const cls=s==='Baik'?'bg-emerald-100 text-emerald-700':s==='Rusak'?'bg-red-100 text-red-700':'bg-amber-100 text-amber-700';return `<span class="px-2 py-1 rounded-full text-xs font-semibold ${cls}">${esc(s||'Baik')}</span>`}
function allItems(){return Object.values(items).sort((a,b)=>String(a.kode||'').localeCompare(String(b.kode||''),undefined,{numeric:true}))}
function listen(path,cb){onValue(ref(db,`${RTDB_ROOT}/${path}`),snap=>cb(snap.val()||{}),e=>console.error(e))}
function loadData(){
 let modern={},legacyKomputer={},legacyPerangkat={};
 const rebuild=()=>{items={...Object.fromEntries(Object.entries(legacyKomputer).map(([k,x])=>[k,{...x,kategori:x.kategori||'Komputer'}])),...Object.fromEntries(Object.entries(legacyPerangkat).map(([k,x])=>[k,{...x,kategori:x.kategori||'Perangkat Pendukung'}])),...modern};render();};
 listen('inventaris',v=>{modern=v||{};rebuild();});
 // Kompatibel dengan data lama: data komputer/perangkat tetap terbaca tanpa menghapus data lama.
 listen('komputer',v=>{legacyKomputer=v||{};rebuild();});
 listen('perangkat',v=>{legacyPerangkat=v||{};rebuild();});
 listen('pengaturan',v=>{settings={...settings,...v};
  if(!settings.principalNiy && v?.principalNip) settings.principalNiy=v.principalNip;
  if(!settings.managerNiy && v?.managerNip) settings.managerNiy=v.managerNip;
  $('sideSchool').textContent=settings.schoolName||'Nama Sekolah';render();});
}
function pageMeta(){return {dashboard:['Dashboard','Ringkasan inventaris laboratorium.'],inventaris:['Inventaris','Kelola barang tanpa spesifikasi komputer yang rumit.'],kondisi:['Kondisi Barang','Lihat barang baik, rusak, dan perlu perbaikan.'],barcode:['Cetak Barcode','Buat label barcode untuk ditempel pada komputer dan inventaris.'],administrasi:['Administrasi & Cetak','Buat dokumen untuk kepala sekolah dari data inventaris.'],pengaturan:['Pengaturan','Identitas sekolah dan penanggung jawab dokumen.']}[currentPage]}
function render(){if(!$('app').classList.contains('hidden')){const [t,d]=pageMeta();$('pageTitle').textContent=t;$('pageDesc').textContent=d;document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('bg-indigo-600',b.dataset.page===currentPage));document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('bg-slate-800',b.dataset.page!==currentPage));const f={dashboard:dashboard,inventaris:inventaris,kondisi:kondisi,barcode:barcode,administrasi:administrasi,pengaturan:pengaturan}[currentPage];$('content').innerHTML=f();}}
function dashboard(){const a=allItems(),baik=a.filter(x=>(x.kondisi||'Baik')==='Baik').length,rusak=a.filter(x=>x.kondisi==='Rusak').length,perbaikan=a.filter(x=>x.kondisi==='Perlu Perbaikan').length;return `<div class="grid md:grid-cols-4 gap-4 mb-6"><div class="bg-white rounded-2xl p-5 shadow-sm"><p class="text-slate-500 text-sm">Total Inventaris</p><b class="text-3xl">${a.length}</b></div><div class="bg-white rounded-2xl p-5 shadow-sm"><p class="text-slate-500 text-sm">Baik</p><b class="text-3xl text-emerald-600">${baik}</b></div><div class="bg-white rounded-2xl p-5 shadow-sm"><p class="text-slate-500 text-sm">Perlu Perbaikan</p><b class="text-3xl text-amber-600">${perbaikan}</b></div><div class="bg-white rounded-2xl p-5 shadow-sm"><p class="text-slate-500 text-sm">Rusak</p><b class="text-3xl text-red-600">${rusak}</b></div></div><div class="bg-white rounded-2xl p-6 shadow-sm"><div class="flex flex-wrap gap-3"><button onclick="showPage('inventaris');openItem()" class="bg-indigo-600 text-white px-4 py-3 rounded-xl"><i class="fa-solid fa-plus mr-2"></i>Tambah Inventaris</button><button onclick="showPage('barcode')" class="border px-4 py-3 rounded-xl">Cetak Barcode</button><button onclick="showPage('administrasi')" class="border px-4 py-3 rounded-xl">Buat Administrasi</button></div><div class="mt-6 p-4 bg-slate-50 rounded-xl text-sm text-slate-600">${a.length?`Data terhubung ke Firebase Realtime Database. Perubahan akan tampil otomatis.`:'Belum ada inventaris. Tambahkan komputer, printer, proyektor, meja, atau barang lab lainnya.'}</div></div>`}
function inventaris(){const a=allItems();return `<div class="bg-white rounded-2xl shadow-sm overflow-hidden"><div class="p-5 flex flex-col md:flex-row gap-3 md:items-center md:justify-between"><input id="searchInv" oninput="renderInvRows()" placeholder="Cari kode, nama, kategori..." class="border rounded-xl px-4 py-3 w-full md:w-96"><button onclick="openItem()" class="bg-indigo-600 text-white px-4 py-3 rounded-xl whitespace-nowrap"><i class="fa-solid fa-plus mr-2"></i>Tambah Barang</button></div><div class="overflow-auto"><table class="w-full text-sm"><thead class="bg-slate-50"><tr><th class="p-3 text-left">Kode</th><th class="p-3 text-left">Nama Barang</th><th class="p-3 text-left">Kategori</th><th class="p-3 text-left">Jumlah</th><th class="p-3 text-left">Lokasi</th><th class="p-3 text-left">Kondisi</th><th class="p-3">Aksi</th></tr></thead><tbody id="invRows"></tbody></table></div></div>`}
window.renderInvRows=()=>{const q=($('searchInv')?.value||'').toLowerCase();const rows=allItems().filter(x=>`${x.kode} ${x.nama} ${x.kategori} ${x.lokasi}`.toLowerCase().includes(q));$('invRows').innerHTML=rows.length?rows.map(x=>`<tr class="border-t"><td class="p-3 font-semibold">${esc(x.kode)}</td><td class="p-3">${esc(x.nama)}</td><td class="p-3">${esc(x.kategori)}</td><td class="p-3">${esc(x.jumlah||1)}</td><td class="p-3">${esc(x.lokasi)}</td><td class="p-3">${statusBadge(x.kondisi)}</td><td class="p-3"><div class="flex justify-center gap-2"><button onclick="openItem('${esc(x.id)}')" class="px-3 py-2 border rounded-lg">Edit</button><button onclick="printLabel('${esc(x.id)}')" class="px-3 py-2 border rounded-lg">Barcode</button><button onclick="deleteItem('${esc(x.id)}')" class="px-3 py-2 border rounded-lg text-red-600">Hapus</button></div></td></tr>`).join(''):`<tr><td colspan="7" class="p-8 text-center text-slate-500">Belum ada data.</td></tr>`}
function kondisi(){const a=allItems();return `<div class="grid md:grid-cols-3 gap-4 mb-5"><div class="bg-emerald-50 rounded-2xl p-5"><div class="text-sm">Baik</div><b class="text-3xl">${a.filter(x=>(x.kondisi||'Baik')==='Baik').length}</b></div><div class="bg-amber-50 rounded-2xl p-5"><div class="text-sm">Perlu Perbaikan</div><b class="text-3xl">${a.filter(x=>x.kondisi==='Perlu Perbaikan').length}</b></div><div class="bg-red-50 rounded-2xl p-5"><div class="text-sm">Rusak</div><b class="text-3xl">${a.filter(x=>x.kondisi==='Rusak').length}</b></div></div><div class="bg-white rounded-2xl shadow-sm overflow-auto"><table class="w-full text-sm"><thead class="bg-slate-50"><tr><th class="p-3 text-left">Kode</th><th class="p-3 text-left">Barang</th><th class="p-3 text-left">Lokasi</th><th class="p-3 text-left">Kondisi</th><th class="p-3 text-left">Keterangan</th><th class="p-3">Aksi</th></tr></thead><tbody>${a.map(x=>`<tr class="border-t"><td class="p-3 font-semibold">${esc(x.kode)}</td><td class="p-3">${esc(x.nama)}</td><td class="p-3">${esc(x.lokasi)}</td><td class="p-3">${statusBadge(x.kondisi)}</td><td class="p-3">${esc(x.keterangan||'-')}</td><td class="p-3 text-center"><button onclick="openItem('${esc(x.id)}')" class="border px-3 py-2 rounded-lg">Ubah</button></td></tr>`).join('')||'<tr><td colspan="6" class="p-8 text-center">Belum ada data.</td></tr>'}</tbody></table></div>`}
function barcode(){const a=allItems();return `<div class="bg-white rounded-2xl p-5 shadow-sm"><div class="flex flex-col md:flex-row gap-3 mb-5"><select id="barcodeFilter" onchange="renderBarcodeList()" class="border rounded-xl px-4 py-3"><option value="all">Semua inventaris</option><option value="Baik">Baik</option><option value="Perlu Perbaikan">Perlu Perbaikan</option><option value="Rusak">Rusak</option></select><button onclick="printAllLabels()" class="bg-indigo-600 text-white rounded-xl px-4 py-3">Cetak Semua Barcode</button></div><div id="barcodeList" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4"></div></div>`}
window.renderBarcodeList=()=>{const f=$('barcodeFilter')?.value||'all';const a=allItems().filter(x=>f==='all'||(x.kondisi||'Baik')===f);$('barcodeList').innerHTML=a.length?a.map(x=>`<div class="border rounded-xl p-4"><div class="text-center text-sm font-semibold">${esc(x.nama)}</div><div class="text-center text-xs text-slate-500 mb-2">${esc(x.kode)} • ${esc(x.kondisi||'Baik')}</div><svg id="bc-${esc(x.id)}"></svg><div class="text-center text-xs">${esc(settings.schoolName)}</div><div class="text-center mt-3"><button onclick="printLabel('${esc(x.id)}')" class="border px-3 py-2 rounded-lg">Cetak</button></div></div>`).join(''):'<div class="text-slate-500">Belum ada inventaris.</div>';setTimeout(()=>a.forEach(x=>{try{JsBarcode('#bc-'+x.id,x.kode||x.id,{format:'CODE128',displayValue:true,height:55,margin:4,fontSize:12});}catch(e){}}),0)}
function administrasi(){const a=allItems();return `<div class="grid md:grid-cols-2 gap-5"><div class="bg-white rounded-2xl p-6 shadow-sm"><h2 class="font-bold text-lg mb-1">Cetak Administrasi</h2><p class="text-sm text-slate-500 mb-5">Pilih jenis dokumen dan data barang yang ingin dimasukkan.</p><div class="space-y-4"><label class="block text-sm font-semibold">Jenis dokumen<select id="docType" class="mt-1 w-full border rounded-xl px-4 py-3"><option value="kerusakan">Laporan Kerusakan Barang</option><option value="perbaikan">Permohonan Perbaikan</option><option value="pengadaan">Permohonan Pengadaan</option><option value="pemberitahuan">Pemberitahuan kepada Kepala Sekolah</option><option value="kondisi">Laporan Kondisi Laboratorium</option><option value="tugas">Surat Tugas Pengelola Laboratorium</option></select></label><label class="block text-sm font-semibold">Barang terkait<select id="docItem" class="mt-1 w-full border rounded-xl px-4 py-3"><option value="">-- Pilih barang --</option>${a.map(x=>`<option value="${esc(x.id)}">${esc(x.kode)} - ${esc(x.nama)} (${esc(x.kondisi||'Baik')})</option>`).join('')}</select></label><label class="block text-sm font-semibold">Keterangan tambahan<textarea id="docNote" rows="4" class="mt-1 w-full border rounded-xl px-4 py-3" placeholder="Contoh: komputer tidak menyala dan perlu diperiksa."></textarea></label><button onclick="printDocument()" class="w-full bg-indigo-600 text-white rounded-xl py-3 font-semibold">Buat & Cetak Dokumen</button></div></div><div class="bg-white rounded-2xl p-6 shadow-sm"><h2 class="font-bold text-lg">Ringkasan</h2><div class="mt-4 space-y-3 text-sm"><div class="flex justify-between"><span>Total inventaris</span><b>${a.length}</b></div><div class="flex justify-between"><span>Rusak</span><b>${a.filter(x=>x.kondisi==='Rusak').length}</b></div><div class="flex justify-between"><span>Perlu perbaikan</span><b>${a.filter(x=>x.kondisi==='Perlu Perbaikan').length}</b></div></div><div class="mt-6 p-4 bg-indigo-50 rounded-xl text-sm">Dokumen dicetak dalam format A4 dan identitas sekolah mengikuti Pengaturan.</div></div></div>`}
function pengaturan(){return `<div class="bg-white rounded-2xl p-6 shadow-sm max-w-3xl"><h2 class="font-bold text-lg mb-2">Identitas Sekolah</h2><p class="text-sm text-slate-500 mb-5">Atur identitas yang digunakan pada kop surat dan bagian tanda tangan.</p><form id="settingsForm" class="grid md:grid-cols-2 gap-4"><label class="text-sm font-semibold">Nama sekolah<input name="schoolName" value="${esc(settings.schoolName)}" class="mt-1 w-full border rounded-xl px-4 py-3" required></label><label class="text-sm font-semibold">Yayasan<input name="foundation" value="${esc(settings.foundation)}" class="mt-1 w-full border rounded-xl px-4 py-3"></label><label class="text-sm font-semibold md:col-span-2">Alamat pada Kop Surat<input name="address" value="${esc(settings.address)}" class="mt-1 w-full border rounded-xl px-4 py-3" placeholder="Alamat lengkap sekolah"></label><label class="text-sm font-semibold md:col-span-2">Kota/Tempat Tanda Tangan<input name="signatureCity" value="${esc(settings.signatureCity)}" class="mt-1 w-full border rounded-xl px-4 py-3" placeholder="Contoh: Jakarta" required></label><label class="text-sm font-semibold">Kepala Sekolah<input name="principal" value="${esc(settings.principal)}" class="mt-1 w-full border rounded-xl px-4 py-3"></label><label class="text-sm font-semibold">NIY Kepala Sekolah<input name="principalNiy" value="${esc(settings.principalNiy)}" class="mt-1 w-full border rounded-xl px-4 py-3" placeholder="Nomor Induk Yayasan"></label><label class="text-sm font-semibold">Pengelola Lab<input name="manager" value="${esc(settings.manager)}" class="mt-1 w-full border rounded-xl px-4 py-3"></label><label class="text-sm font-semibold">NIY Pengelola<input name="managerNiy" value="${esc(settings.managerNiy)}" class="mt-1 w-full border rounded-xl px-4 py-3" placeholder="Nomor Induk Yayasan"></label><label class="text-sm font-semibold md:col-span-2">Logo sekolah (URL, opsional)<input name="logo" value="${esc(settings.logo)}" class="mt-1 w-full border rounded-xl px-4 py-3"></label><div class="md:col-span-2"><button class="bg-indigo-600 text-white px-5 py-3 rounded-xl">Simpan Pengaturan</button></div></form></div>`}
window.openItem=(id='')=>{const x=items[id]||{};$('modalTitle').textContent=id?'Edit Inventaris':'Tambah Inventaris';$('modalBody').innerHTML=`<form id="itemForm" class="grid md:grid-cols-2 gap-4"><input type="hidden" name="id" value="${esc(id)}"><label class="text-sm font-semibold">Kode Inventaris<input name="kode" value="${esc(x.kode||'LAB-'+String(Object.keys(items).length+1).padStart(3,'0'))}" class="mt-1 w-full border rounded-xl px-4 py-3" required></label><label class="text-sm font-semibold">Nama Barang<input name="nama" value="${esc(x.nama)}" placeholder="Komputer, printer, proyektor..." class="mt-1 w-full border rounded-xl px-4 py-3" required></label><label class="text-sm font-semibold">Kategori<select name="kategori" class="mt-1 w-full border rounded-xl px-4 py-3"><option ${x.kategori==='Komputer'?'selected':''}>Komputer</option><option ${x.kategori==='Perangkat Pendukung'?'selected':''}>Perangkat Pendukung</option><option ${x.kategori==='Furniture'?'selected':''}>Furniture</option><option ${x.kategori==='Lainnya'?'selected':''}>Lainnya</option></select></label><label class="text-sm font-semibold">Jumlah<input name="jumlah" type="number" min="1" value="${esc(x.jumlah||1)}" class="mt-1 w-full border rounded-xl px-4 py-3"></label><label class="text-sm font-semibold">Lokasi/Ruangan<input name="lokasi" value="${esc(x.lokasi)}" placeholder="Lab Komputer" class="mt-1 w-full border rounded-xl px-4 py-3"></label><label class="text-sm font-semibold">Kondisi<select name="kondisi" class="mt-1 w-full border rounded-xl px-4 py-3"><option ${(!x.kondisi||x.kondisi==='Baik')?'selected':''}>Baik</option><option ${x.kondisi==='Perlu Perbaikan'?'selected':''}>Perlu Perbaikan</option><option ${x.kondisi==='Rusak'?'selected':''}>Rusak</option></select></label><label class="text-sm font-semibold md:col-span-2">Keterangan<textarea name="keterangan" rows="3" class="mt-1 w-full border rounded-xl px-4 py-3">${esc(x.keterangan)}</textarea></label><div class="md:col-span-2 flex justify-end gap-2"><button type="button" onclick="closeModal()" class="border px-5 py-3 rounded-xl">Batal</button><button class="bg-indigo-600 text-white px-5 py-3 rounded-xl">Simpan</button></div></form>`;$('modal').classList.remove('hidden');$('modal').classList.add('flex');$('itemForm').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const id=d.id||crypto.randomUUID();d.id=id;d.jumlah=Number(d.jumlah||1);d.updatedAt=Date.now();await set(ref(db,`${RTDB_ROOT}/inventaris/${id}`),d);closeModal();};}
window.deleteItem=async id=>{if(confirm('Hapus data inventaris ini?'))await remove(ref(db,`${RTDB_ROOT}/inventaris/${id}`));}
window.closeModal=()=>{$('modal').classList.add('hidden');$('modal').classList.remove('flex')}
window.printLabel=id=>{const x=items[id];if(!x)return;const host=$('printHost');host.innerHTML=`<div class="print-area"><div class="barcode-label"><div class="font-bold text-sm">${esc(settings.schoolName)}</div><div class="font-semibold">${esc(x.nama)}</div><div class="text-xs">${esc(x.kategori)} • ${esc(x.lokasi)}</div><svg id="singleBc"></svg><div class="font-bold text-sm">${esc(x.kode)}</div><div class="text-xs">Kondisi: ${esc(x.kondisi||'Baik')}</div></div></div>`;host.classList.remove('hidden');JsBarcode('#singleBc',x.kode,{format:'CODE128',displayValue:false,height:60,margin:3});setTimeout(()=>{window.print();host.classList.add('hidden')},150)}
window.printAllLabels=()=>{const a=allItems();const host=$('printHost');host.innerHTML=`<div class="print-area grid grid-cols-2 gap-3 p-5">${a.map((x,i)=>`<div class="barcode-label"><div class="font-bold text-sm">${esc(settings.schoolName)}</div><div class="font-semibold">${esc(x.nama)}</div><div class="text-xs">${esc(x.kategori)} • ${esc(x.lokasi)}</div><svg id="allBc${i}"></svg><div class="font-bold text-sm">${esc(x.kode)}</div><div class="text-xs">Kondisi: ${esc(x.kondisi||'Baik')}</div></div>`).join('')}</div>`;host.classList.remove('hidden');a.forEach((x,i)=>JsBarcode('#allBc'+i,x.kode,{format:'CODE128',displayValue:false,height:60,margin:3}));setTimeout(()=>{window.print();host.classList.add('hidden')},200)}
function letterHead(){return `<div style="text-align:center;border-bottom:2px solid #111;padding-bottom:10px;margin-bottom:25px">${settings.logo?`<img src="${esc(settings.logo)}" style="height:55px;margin:0 auto 5px">`:''}<div style="font-size:15px;font-weight:bold">${esc(settings.foundation)}</div><div style="font-size:20px;font-weight:bold">${esc(settings.schoolName)}</div><div style="font-size:12px">${esc(settings.address)}</div></div>`}
window.printDocument=()=>{const type=$('docType').value,id=$('docItem').value,note=$('docNote').value;const x=items[id];const titles={kerusakan:'LAPORAN KERUSAKAN BARANG',perbaikan:'PERMOHONAN PERBAIKAN BARANG',pengadaan:'PERMOHONAN PENGADAAN BARANG',pemberitahuan:'PEMBERITAHUAN KEPADA KEPALA SEKOLAH',kondisi:'LAPORAN KONDISI LABORATORIUM',tugas:'SURAT TUGAS PENGELOLA LABORATORIUM'};let body='';if(type==='tugas'){body=`<p>Dengan ini menugaskan:</p><table style="margin:15px auto"><tr><td style="padding:4px 20px 4px 0">Nama</td><td>: ${esc(settings.manager||'................................')}</td></tr><tr><td style="padding:4px 20px 4px 0">NIY</td><td>: ${esc(settings.managerNiy||'................................')}</td></tr><tr><td style="padding:4px 20px 4px 0">Tugas</td><td>: Pengelolaan Laboratorium Komputer</td></tr></table><p>Demikian surat tugas ini dibuat untuk dilaksanakan sebagaimana mestinya.</p>`}else if(type==='kondisi'){const a=allItems();body=`<p>Berikut rekap kondisi inventaris laboratorium:</p><table style="width:100%;border-collapse:collapse;margin-top:15px"><tr><th style="border:1px solid #111;padding:7px">No</th><th style="border:1px solid #111;padding:7px">Kode</th><th style="border:1px solid #111;padding:7px">Barang</th><th style="border:1px solid #111;padding:7px">Lokasi</th><th style="border:1px solid #111;padding:7px">Kondisi</th></tr>${a.map((z,i)=>`<tr><td style="border:1px solid #111;padding:7px;text-align:center">${i+1}</td><td style="border:1px solid #111;padding:7px">${esc(z.kode)}</td><td style="border:1px solid #111;padding:7px">${esc(z.nama)}</td><td style="border:1px solid #111;padding:7px">${esc(z.lokasi)}</td><td style="border:1px solid #111;padding:7px">${esc(z.kondisi||'Baik')}</td></tr>`).join('')}</table>`}else{if(!x){alert('Pilih barang terlebih dahulu.');return}body=`<p>Dengan hormat, bersama ini kami menyampaikan bahwa terdapat data inventaris sebagai berikut:</p><table style="margin:15px 0"><tr><td style="padding:5px 20px 5px 0">Kode</td><td>: ${esc(x.kode)}</td></tr><tr><td style="padding:5px 20px 5px 0">Nama Barang</td><td>: ${esc(x.nama)}</td></tr><tr><td style="padding:5px 20px 5px 0">Kategori</td><td>: ${esc(x.kategori)}</td></tr><tr><td style="padding:5px 20px 5px 0">Lokasi</td><td>: ${esc(x.lokasi)}</td></tr><tr><td style="padding:5px 20px 5px 0">Kondisi</td><td>: ${esc(x.kondisi||'Baik')}</td></tr></table><p>${esc(note||x.keterangan||'Mohon dapat ditindaklanjuti sesuai kebutuhan.')}</p>`}const html=`<div class="print-area" style="font-family:Arial,sans-serif;font-size:12pt;line-height:1.6;padding:20mm"><style>@page{size:A4;margin:0}</style>${letterHead()}<h2 style="text-align:center;font-size:16px;margin:20px 0;text-decoration:underline">${titles[type]}</h2>${body}<div style="margin-top:45px;margin-left:65%;text-align:center">${esc(settings.signatureCity||'....................')}, ${new Date().toLocaleDateString('id-ID')}<br>Kepala Sekolah<br><br><br><b><u>${esc(settings.principal||'................................')}</u></b><br>${settings.principalNiy?`NIY. ${esc(settings.principalNiy)}`:''}</div></div>`;$('printHost').innerHTML=html;$('printHost').classList.remove('hidden');setTimeout(()=>{window.print();$('printHost').classList.add('hidden')},100)}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginError').textContent='';try{await signInWithEmailAndPassword(auth,$('email').value,$('password').value)}catch(err){$('loginError').textContent='Email atau password salah / akun belum terdaftar.'}};
$('logout').onclick=()=>signOut(auth);document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>showPage(b.dataset.page));window.showPage=p=>{currentPage=p;render();if(p==='inventaris')setTimeout(renderInvRows,0);if(p==='barcode')setTimeout(renderBarcodeList,0)};
$('mobileMenu').onclick=()=>alert('Gunakan menu pada tampilan desktop. Versi mobile tetap dapat dibuka dan digunakan untuk melihat data.');
$('content').addEventListener('submit',async e=>{if(e.target.id==='settingsForm'){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));await set(ref(db,`${RTDB_ROOT}/pengaturan`),d);alert('Pengaturan tersimpan.')}});
onAuthStateChanged(auth,user=>{if(user){$('login').classList.add('hidden');$('app').classList.remove('hidden');loadData();render()}else{$('login').classList.remove('hidden');$('app').classList.add('hidden')}});
</script>
</body></html>
